name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check responsive layout profiles
        run: python3 tools/check_layout_profiles.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Upstream generated a throwaway key and kept it in actions/cache. That cache
      # is per-repository and expires, and when it does the next build signs with a
      # different key, which Android refuses to install over the previous one. This
      # fork decodes a keystore held in a repository secret, so the key is stable.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FCMGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret FCMGUARD_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          mkdir -p ci-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ci-signing/release.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # assembleRelease rather than assembleDebug: a debug build carries
      # android:debuggable=true, which lets any adb user attach a debugger to an app
      # that holds WRITE_SETTINGS.
      - name: Build release APK
        env:
          FCMGUARD_KEYSTORE: ${{ github.workspace }}/ci-signing/release.keystore
          FCMGUARD_STORE_PASSWORD: ${{ secrets.FCMGUARD_STORE_PASSWORD }}
          FCMGUARD_KEY_ALIAS: ${{ secrets.FCMGUARD_KEY_ALIAS }}
          FCMGUARD_KEY_PASSWORD: ${{ secrets.FCMGUARD_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Read version and prepare release APKs
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          APK_NAME="FCMGuard-HyperOS-${TAG}.apk"
          LATEST_APK_NAME="FCMGuard-HyperOS.apk"
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::No $SRC. The release build was not signed." >&2
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          cp "$SRC" "$APK_NAME"
          cp "$SRC" "$LATEST_APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "latest_apk_name=$LATEST_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMGuard-release-apk
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 30

      # Feature branches validate the APK; only main publishes or refreshes Releases.
      - name: Publish APKs to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          LATEST_APK_NAME: ${{ steps.version.outputs.latest_apk_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$LATEST_APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" "$LATEST_APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "FCM Guard ${VERSION} (fork release build)" \
              --notes "Release build of a personal fork. Install with: adb install --bypass-low-target-sdk-block FCMGuard-HyperOS.apk"
          fi
